[package]
name = "scryone"
version = "0.2.3"
edition = "2024"
authors = ["Graham Keenan <graham.keenan@outlook.com>"]
license = "MIT OR Apache-2.0"
description = "API Client for Scryfall (Magic: the Gathering Search API)"
readme = "README.md"
repository = "https://github.com/Tyrannican/scryone"
keywords = ["magic", "mtg", "scryfall"]
categories = ["web-programming", "web-programming::http-client", "data-structures", "api-bindings"]

[dependencies]
jiff = { version = "0.2.24", features = ["serde"] }
reqwest = { version = "0.13.3", features = ["blocking", "json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["rt"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.1", features = ["v4", "std", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.150"
flate2 = "1.1.9"
